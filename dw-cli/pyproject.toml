[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-cli"
version = "0.2.0"
description = "DataWorks 私有云 CLI（2020-05-18 SDK + 凭据链 + RegionId 注入）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "alibabacloud-dataworks-public20200518",
    "alibabacloud-credentials",
    "alibabacloud-tea-openapi",
    "alibabacloud-tea-util",
    "jmespath",
    "pyodps",`n    "requests",
]

[project.scripts]
dw-cli = "dw_cli.main:app"

[tool.setuptools.packages.find]
include = ["dw_cli*"]
