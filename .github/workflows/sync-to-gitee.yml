name: Sync to Gitee

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        run: |
          git remote add gitee https://assassinv:${{ secrets.GITEE_TOKEN }}@gitee.com/assassinv/dw-cli.git
          git push -f gitee --all
          git push -f gitee --tags
